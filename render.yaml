services:
  # 1. NEURON Deep Telemetry API Service
  - type: web
    name: neuron-api
    env: python
    region: oregon
    plan: free
    buildCommand: "pip install -r backend/requirements.txt && python model/train_neuronet.py"
    startCommand: "uvicorn backend.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: RENDER_ENVIRONMENT
        value: production

  # 2. NEURON Asynchronous Background Worker (Render Workflows Track)
  - type: worker
    name: neuron-pipeline-worker
    env: python
    region: oregon
    plan: free
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "python backend/worker.py"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9

  # 3. NEURON Clinical Web Interface
  - type: web
    name: neuron-web
    env: static
    buildCommand: "npm install && npm run build"
    staticPublishPath: "./dist"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
